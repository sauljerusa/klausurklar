<style>
/* VOICE: sophisticated, calm study companion – a leather planner, not a toy.
   IDEA: a black leather planner cover with cognac stitching; inside, ivory pages.
   PICTURE: the progress ring on the black cover, cognac fill, big serif percentage.
   COLOUR and TYPE: black #15120f, cognac #8a5a34 / #c9955f, navy #2c4a7a for done; ivory pages; DM Serif Display + Inter.
   LAYOUT: phone-first single column, black cover header, ivory cards, fixed bottom bar with five tabs. */
:root{color-scheme:light dark;--bg:light-dark(#f5f1eb,#0e0c0a);--card:light-dark(#fffdf9,#1a1613);--ink:light-dark(#16120f,#efe8df);--mut:light-dark(#6e6358,#a99d90);--line:light-dark(#e5dccf,#2e2722);--blk:#15120f;--brn:light-dark(#8a5a34,#c9955f);--brn2:light-dark(#f3e6d8,#33251a);--nav:light-dark(#2c4a7a,#7fa3d6);--nav2:light-dark(#e4eaf3,#18233a);--red:light-dark(#a8322b,#e0786f);--red2:light-dark(#f8e3e0,#3a1a17)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:86px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
header{background:var(--blk);color:#f3ece3;padding:calc(18px + env(safe-area-inset-top)) 0 22px;border-radius:0 0 26px 26px;border-bottom:3px solid #8a5a34}
.brand{font:400 15px "DM Serif Display",serif;color:#c9955f;letter-spacing:.04em;margin-bottom:12px}
.top{display:flex;gap:14px;align-items:center}
.av{width:64px;height:64px;border-radius:50%;background:#2a221c;flex:none;display:grid;place-items:center;font-size:26px;overflow:hidden;border:2px solid #c9955f;color:#f3ece3}
.av img{width:100%;height:100%;object-fit:cover}
.hi{font-size:26px;line-height:1.1}.course{font-size:13px;color:#c9b8a6}
.quote{margin:14px 0 0;font-size:15.5px;color:#e6d6c4;font-style:italic}
.hero{display:flex;gap:18px;align-items:center;margin-top:18px;border:1px dashed rgba(201,149,95,.45);border-radius:18px;padding:14px}
.ring{width:118px;height:118px;flex:none;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:30px;line-height:1}
.ring b small{display:block;font:500 11px Inter,sans-serif;color:#c9b8a6;margin-top:4px}
.stats{display:grid;gap:8px;font-size:13.5px;color:#d9cbbb}.stats strong{font-size:22px;color:#fff;font-family:"DM Serif Display",serif;font-weight:400}
.cd{display:flex;gap:10px;overflow-x:auto;padding:14px 0 4px}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:118px}
.chip b{display:block;font:400 23px/1.1 "DM Serif Display",serif}.chip span{font-size:12.5px;color:var(--mut)}
h2{font:400 24px/1.2 "DM Serif Display",serif;margin:22px 0 10px}
h3{margin:0;font-size:16px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.st{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;font-weight:700;font-size:15px}
.st.s1{border-color:var(--brn);background:var(--brn2);color:var(--brn)}
.st.s2{border-color:var(--nav);background:var(--nav);color:var(--card)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c9955f;outline-offset:2px}
.txt{flex:1;font-size:14.5px;padding-top:5px}.txt.done{color:var(--mut);text-decoration:line-through}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-right:4px;vertical-align:1px;letter-spacing:.02em}
.tN{background:var(--nav2);color:var(--nav)}.tA{background:var(--brn2);color:var(--brn)}.tW{background:var(--red2);color:var(--red)}

.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;background:none;border:0;width:100%;text-align:left;padding:0}
.pct{font:400 22px "DM Serif Display",serif}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fb{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;cursor:pointer;min-height:40px;font-size:14px}.fb.on{background:var(--blk);color:#f3ece3;border-color:var(--blk)}
.add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.inp{flex:1 1 140px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);font-size:16px;min-height:44px}
.btn{border:0;border-radius:12px;background:var(--blk);color:#f3ece3;font-weight:600;padding:10px 16px;cursor:pointer;min-height:44px}
:root[data-theme=dark] .btn,.btn{box-shadow:inset 0 0 0 1px #8a5a34}
.btn.alt{background:var(--brn2);color:var(--brn);box-shadow:none}
.del{background:none;border:0;color:var(--mut);cursor:pointer;font-size:20px;width:34px;height:34px;flex:none}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.ex:first-child{border-top:0}
.ex .nm{flex:1 1 150px;font-weight:500;font-size:15px}.ex input[type=date]{width:150px;flex:none;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg)}
.days{font-weight:600;min-width:64px;text-align:right;white-space:nowrap}
.warn{border-color:var(--red);background:var(--red2)}
.alert{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tab{flex:1;max-width:120px;background:none;border:0;padding:7px 2px;border-radius:12px;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--mut);display:grid;justify-items:center;gap:2px;min-height:52px}
.tab svg{width:22px;height:22px}.tab.on{color:var(--ink);background:var(--brn2)}
.view{display:none}.view.on{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:-2px 0 12px}.legend span{display:flex;align-items:center;gap:6px}
.lg{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.note{font-size:13px;color:var(--mut);text-align:center;margin:18px 0}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.timer{text-align:center;padding:22px 14px}
.clock{font:400 clamp(64px,22vw,96px)/1 "DM Serif Display",serif;letter-spacing:.01em;margin:6px 0 4px}
.mode{display:inline-flex;gap:6px;margin-bottom:6px}
.tbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
select.inp{width:100%}
.hm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.hm i{aspect-ratio:1;border-radius:4px;background:var(--line);display:block}
.hm i.l1{background:light-dark(#d8c2aa,#5a412b)}.hm i.l2{background:var(--brn)}.hm i.l3{background:var(--nav)}.hm i.td{outline:2px solid var(--ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bd{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;color:var(--mut)}.bd b{display:block;font:400 22px "DM Serif Display",serif;color:var(--mut)}
.bd.on{border-color:var(--brn);background:var(--brn2);color:var(--ink)}.bd.on b{color:var(--brn)}
.hrs{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.hrs:first-child{border-top:0}
.hrs .bar{grid-column:1/-1}

@media(prefers-reduced-motion:no-preference){.ringbox{animation:shake 1s ease-in-out infinite}@keyframes shake{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-1deg)}20%,40%{transform:rotate(1deg)}50%{transform:rotate(0)}}}
.sndrow{display:flex;gap:8px;margin-top:6px}.sndrow select{flex:1}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--blk);color:#f3ece3;border:1px solid #c9955f;border-radius:14px;padding:12px 18px;z-index:9;font-size:15px;max-width:90vw;text-align:center;display:none}
.toast.on{display:block}
@media(prefers-reduced-motion:no-preference){.ring circle.v{transition:stroke-dashoffset .6s ease}.bar i{transition:width .4s}.toast.on{animation:pop .4s ease}@keyframes pop{from{opacity:0;transform:translate(-50%,-10px)}}}

 <div class="filters" style="justify-content:center;margin:12px 0 0">${[25,45,60].map(m=>`<button class="fb${T.len==m&&T.mode=="f"?" on":""}" data-len="${m}">${m} min</button>`).join("")}</div>
 <label class="f" for="snd" style="text-align:left">Som do alarme</label><div class="sndrow"><select class="inp" id="snd">${Object.entries(SOUNDS).map(([k,l])=>`<option value="${k}"${(S.snd||"game")==k?" selected":""}>${l}</option>`).join("")}</select><button class="btn alt" id="ptest" aria-label="Testar som">Testar</button></div><p class="muted" style="margin:6px 0 0;text-align:left">Deixe o app aberto e a tela ligada para o alarme tocar.</p>
 <div class="tbtns"><button class="btn" id="tgo" style="min-width:130px">${T.on?"Pausar":"Começar"}</button><button class="btn alt" id="tstop">Encerrar e salvar</button></div></div>`;
 h+=`<div class="card"><h3>Horas estudadas x planejadas</h3><p class="muted" style="margin:2px 0 6px">Total registrado: ${fh(tot)}</p>${D.subs.map(s=>{const m=S.t[s.n]||0,pl=(PLANH[s.n]||0)*60,w=pl?Math.min(m/pl*100,100):0;return`<div class="hrs"><span><span class="dot" style="background:${s.c}"></span> ${esc(s.n)}</span><span class="muted">${fh(m)} / ${fh(pl)}</span><div class="bar"><i style="width:${w}%;background:var(--brn)"></i></div></div>`}).join("")}</div>`;
 const st=streak(),start=dd("2026-11-23"),end=dd("2027-02-28"),cells=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const k=iso(d),v=S.days[k]||0;cells.push(`<i class="${v>=90?"l3":v>=30?"l2":v?"l1":""}${k==iso(today())?" td":""}" title="${d.getDate()}/${d.getMonth()+1}${v?" · estudou":""}"></i>`)}
 h+=`<div class="card"><h3>Sequência: ${st} dia${st==1?"":"s"}</h3><p class="muted" style="margin:2px 0 10px">Cada quadrado é um dia, de 23/11 a 28/02 (semanas começando na segunda). Fica colorido quando você estuda.</p><div class="hm">${cells.join("")}</div></div>`;
 const B=[["p25","25%","estudado"],["p50","50%","estudado"],["p75","75%","estudado"],["p100","100%","tudo!"],["s3","3","dias seguidos"],["s7","7","dias seguidos"],["s14","14","dias seguidos"],["f1","1º","Pomodoro"],["h10","10h","de foco"]];
 h+=`<div class="card"><h3>Conquistas</h3><div class="badges" style="margin-top:10px">${B.map(([k,a,b])=>`<div class="bd${S.ach[k]?" on":""}"><b>${a}</b>${b}</div>`).join("")}</div></div>`;
 $("v-foco").innerHTML=h;
}
const SOUNDS={game:"Videogame (level up)",sino:"Sininho",fanfarra:"Fanfarra",marimba:"Marimba",passaro:"Passarinho",samba:"Samba (agogô)"};
let AC=null,loopIv=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}
function tone(a,f,st,du,ty,g,f2){const o=a.createOscillator(),v=a.createGain(),t0=a.currentTime+st;o.type=ty;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+du);v.gain.setValueAtTime(0.0001,t0);v.gain.exponentialRampToValueAtTime(g,t0+.01);v.gain.exponentialRampToValueAtTime(0.0001,t0+du);o.connect(v);v.connect(a.destination);o.start(t0);o.stop(t0+du+.05)}
function playSnd(k){const a=ac();if(!a)return;
 if(k=="game"){[523,659,784,1047,1319,1568,2093].forEach((f,i)=>tone(a,f,i*.08,.12,"square",.08));tone(a,2093,.62,.35,"square",.07)}
 else if(k=="sino"){[1047,1319,1568,2093].forEach((f,i)=>{tone(a,f,i*.22,1.4,"sine",.25);tone(a,f*2.7,i*.22,.5,"sine",.05)})}
 else if(k=="fanfarra"){[[392,0,.14],[392,.16,.14],[392,.32,.14],[523,.48,.7],[659,.48,.7],[784,.48,.7]].forEach(([f,s,d])=>{tone(a,f,s,d,"sawtooth",.07);tone(a,f*1.005,s,d,"square",.03)})}
 else if(k=="marimba"){[[784,0],[659,.15],[784,.3],[1047,.45],[988,.75],[1047,.9]].forEach(([f,s])=>{tone(a,f,s,.45,"triangle",.35);tone(a,f*4,s,.06,"sine",.06)})}
 else if(k=="passaro"){[[2200,3200,0],[2400,3600,.18],[2000,3000,.5],[2600,3800,.65],[2300,3400,.8]].forEach(([f,f2,s])=>tone(a,f,s,.12,"sine",.18,f2))}
 else if(k=="samba"){[[880,0],[660,.18],[660,.36],[880,.54],[660,.72],[880,.81],[660,.99]].forEach(([f,s])=>{tone(a,f,s,.13,"square",.06);tone(a,f*1.5,s,.05,"sine",.05)});[0,.27,.54,.81].forEach(s=>tone(a,150,s,.12,"sine",.3,60))}
}
function startAlarm(){stopAlarm();let n=0;const k=S.snd||"game";playSnd(k);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}loopIv=setInterval(()=>{if(++n>=12){stopAlarm();return}playSnd(k)},2400)}
function stopAlarm(){clearInterval(loopIv);loopIv=null}
function startTimer(){ac();T.on=true;T.end=Date.now()+T.left*1000;if(!T.startLeft)T.startLeft=T.left;clearInterval(T.iv);T.iv=setInterval(tick,500)}
function logFocus(){if(T.mode!=="f")return;const used=Math.round((T.startLeft-T.left)/60);if(used>=1){S.t[T.subj]=(S.t[T.subj]||0)+used;mark(used);checkAch();save()}T.startLeft=T.left}
function tick(){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));const c=$("clock");if(c)c.textContent=clk(T.left);document.title=T.on?clk(T.left)+" · Klausurklar":"Klausurklar";if(T.left<=0){clearInterval(T.iv);T.on=false;document.title="Klausurklar";if(T.mode=="f"){logFocus();T.ring="f";T.mode="p";T.left=T.startLeft=(T.len>=45?10:5)*60}else{T.ring="p";T.mode="f";T.left=T.startLeft=T.len*60}startAlarm();render();toast(T.ring=="f"?"Tempo de foco acabou! Toque em Iniciar pausa.":"A pausa acabou! Bora voltar?")}}
function vDatas(){
 let h=`<h2>Provas</h2><div class="card"><b>Período de provas: 08 a 26/02/2027</b><div class="muted">Inscrição no MeinFHEcampus: 21/12/2026 a 24/01/2027</div></div><div class="card">`+EXAMS.map(e=>{const d=S.x[e],n=d?daysTo(d):null;return`<div class="ex"><span class="nm"><span class="dot" style="background:${COLOR[e.replace(" – Testat","")]||"#9a8b7c"};margin-right:8px"></span>${esc(e)}</span><input type="date" data-x="${esc(e)}" value="${d||""}" aria-label="Data da prova de ${esc(e)}"><span class="days">${n===null?'<span class="muted">sem data</span>':n<0?"feita":n+" dias"}</span></div>`}).join("")+`</div>`;
 const L=S.dl.slice().sort((a,b)=>(a.ok-b.ok)||(a.d<b.d?-1:1));
 h+=`<h2>Prazos de entrega</h2><div class="card">${L.map(x=>{const n=daysTo(x.d),cl=x.ok?"":n<0?"var(--red)":n<=1?"var(--red)":"inherit";return`<div class="row">${`<button class="st ${x.ok?"s2":""}" data-dl="${x.id}" aria-label="${x.ok?"Entregue":"Marcar como entregue"}">${x.ok?"✓":""}</button>`}<div class="txt${x.ok?" done":""}">${esc(x.t)}<div class="muted">${dd(x.d).toLocaleDateString("pt-BR")}${x.s?" · "+esc(x.s):""}</div></div><b class="days" style="color:${cl};padding-top:5px">${x.ok?"":n<0?"venceu":n==0?"hoje":n==1?"amanhã":n+" d"}</b><button class="del" data-ddel="${x.id}" aria-label="Remover prazo">×</button></div>`}).join("")||'<span class="muted">Nenhum prazo.</span>'}
 <form class="add" id="dlf"><input class="inp" id="dlt" placeholder="Nova entrega (ex.: WI Übung 5)" aria-label="Descrição do prazo"><input class="inp" type="date" id="dld" aria-label="Data" style="flex:0 1 150px"><select class="inp" id="dls" aria-label="Matéria" style="flex:1 1 100%"><option value="">Matéria (opcional)</option>${D.subs.map(s=>`<option>${esc(s.n)}</option>`).join("")}</select><button class="btn" style="flex:1 1 100%">Adicionar prazo</button><span class="muted" id="dle" style="color:var(--red)"></span></form></div>`;
 $("v-datas").innerHTML=h;
}
function vPerf(){
 $("v-perf").innerHTML=`<h2>Perfil</h2><div class="card" style="text-align:center"><div class="av serif" style="width:112px;height:112px;margin:0 auto 12px;background:var(--blk);font-size:40px">${S.photo?`<img src="${S.photo}" alt="Sua foto">`:esc((S.name||"J")[0])}</div><button class="btn" id="ph">${S.photo?"Trocar foto":"Adicionar foto"}</button>${S.photo?' <button class="btn alt" id="rmph">Remover</button>':""}</div>
 <div class="card"><label class="f" for="nm">Nome</label><input class="inp" id="nm" value="${esc(S.name)}" style="width:100%"><label class="f" for="cs">Curso</label><input class="inp" id="cs" value="${esc(S.course)}" style="width:100%"></div><div class="card"><h3>Backup</h3><p class="muted" style="margin:4px 0 10px">Seu progresso fica só neste celular. Baixe um backup de vez em quando (ou para passar para outro aparelho).</p><div class="tbtns" style="justify-content:flex-start;margin-top:0"><button class="btn" id="bkdl">Baixar backup</button><button class="btn alt" id="bkup">Restaurar backup</button></div><span class="muted" id="bkmsg"></span></div>`;
}
function render(){header();vHoje();vMat();vFoco();vDatas();vPerf()}
function save(){clearTimeout(tmr);tmr=setTimeout(flush,700);try{localStorage.setItem("plano-jerusa",JSON.stringify(S))}catch(e){}}
async function flush(){return;if(!ref)return;if(writing){pending=true;return}writing=true;try{await ref.set(JSON.parse(JSON.stringify(S)));$("sync").textContent="Progresso salvo na sua conta ✓"}catch(e){$("sync").textContent="Não consegui salvar agora – tentarei de novo."}writing=false;if(pending){pending=false;flush()}}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.k){const o=S[b.dataset.k],id=b.dataset.id,nv=((o[id]||0)+1)%3;if(nv)o[id]=nv;else delete o[id];if(nv)mark(0);checkAch();save();render();return}
 if(b.dataset.v){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+b.dataset.v));scrollTo({top:0});return}
 if(b.dataset.o){open[b.dataset.o]=!open[b.dataset.o];vMat();return}
 if(b.dataset.f){filt=b.dataset.f;vMat();return}
 if(b.dataset.del){const[s,i]=b.dataset.del.split("|");S.c[s]=(S.c[s]||[]).filter(x=>x.id!==i);delete S.m[i];save();render();return}
 if(b.dataset.dl){const x=S.dl.find(y=>y.id===b.dataset.dl);if(x){x.ok=!x.ok;save();render()}return}
 if(b.dataset.ddel){S.dl=S.dl.filter(y=>y.id!==b.dataset.ddel);save();render();return}
 if(b.dataset.tm){if(T.on)return;stopAlarm();T.ring="";T.mode=b.dataset.tm;T.left=T.startLeft=(T.mode=="f"?T.len:(T.len>=45?10:5))*60;vFoco();return}
 if(b.dataset.len){if(T.on)return;stopAlarm();T.ring="";T.len=+b.dataset.len;T.mode="f";T.left=T.startLeft=T.len*60;vFoco();return}
 if(b.id==="tgo"){stopAlarm();T.ring="";if(T.on){clearInterval(T.iv);T.on=false;T.left=Math.max(0,Math.round((T.end-Date.now())/1000))}else startTimer();vFoco();return}
 if(b.id==="rgo"){stopAlarm();T.ring="";T.startLeft=T.left;startTimer();vFoco();return}
 if(b.id==="rstop"){stopAlarm();T.ring="";vFoco();return}
 if(b.id==="ptest"){playSnd(S.snd||"game");return}
 if(b.id==="tstop"){stopAlarm();T.ring="";clearInterval(T.iv);if(T.on)T.left=Math.max(0,Math.round((T.end-Date.now())/1000));T.on=false;const before=Object.values(S.t).reduce((a,c)=>a+c,0);logFocus();const after=Object.values(S.t).reduce((a,c)=>a+c,0);toast(after>before?`Salvo: ${fh(after-before)} de ${T.subj}`:"Menos de 1 minuto – nada salvo");T.mode="f";T.left=T.startLeft=T.len*60;document.title="Klausurklar";render();return}
 if(b.id==="tgAll"){showAll=!showAll;vHoje();return}
 if(b.id==="ph"){$("file").click();return}
 if(b.id==="bkdl"){const bl=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="klausurklar-backup-"+iso(today())+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return}
 if(b.id==="bkup"){$("bkfile").click();return}
 if(b.id==="rmph"){S.photo="";save();render()}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
 if(f.id==="dlf"){const t=$("dlt").value.trim(),d=$("dld").value;if(!t||!d){$("dle").textContent="Escreva a entrega e escolha a data.";return}S.dl.push({id:"d"+Date.now().toString(36),t,s:$("dls").value,d,ok:false});save();render();return}
 const s=f.dataset.add,inp=f.querySelector("input"),t=inp&&inp.value.trim();if(!s||!t)return;(S.c[s]=S.c[s]||[]).push({id:"c"+Date.now().toString(36),t});save();render();setTimeout(()=>{const n=document.querySelector(`form[data-add="${s}"] input`);n&&n.focus()},0)});
document.addEventListener("change",e=>{const x=e.target;if(x.dataset.x!==undefined){if(x.value)S.x[x.dataset.x]=x.value;else delete S.x[x.dataset.x];save();render()}else if(x.id==="nm"){S.name=x.value.trim()||"Jerusa";save();header()}else if(x.id==="cs"){S.course=x.value.trim();save();header()}else if(x.id==="snd"){S.snd=x.value;save();playSnd(x.value)}else if(x.id==="tsub"){if(T.on)logFocus();T.subj=x.value;vFoco()}});
document.addEventListener("input",e=>{if(e.target.id==="dlt"||e.target.id==="dld"){const m=$("dle");if(m)m.textContent=""}});
$("file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const z=256,c=document.createElement("canvas");c.width=c.height=z;const m=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,z,z);S.photo=c.toDataURL("image/jpeg",.82);URL.revokeObjectURL(u);save();render()};img.src=u;e.target.value=""});
$("bkfile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o||typeof o!="object"||!o.m)throw 0;merge(o);save();render();toast("Backup restaurado!")}catch(err){const m=$("bkmsg");if(m)m.textContent="Esse arquivo não é um backup válido do Klausurklar."}e.target.value=""});
$("quote").textContent="“"+QUOTES[Math.floor(today()/864e5)%QUOTES.length]+"”";
function merge(o){S=Object.assign({},S,o);["m","p","c","x","t","days","ach"].forEach(k=>{if(!S[k]||typeof S[k]!="object")S[k]={}});if(!Array.isArray(S.dl))S.dl=SEED}
try{const l=JSON.parse(localStorage.getItem("plano-jerusa")||"null");if(l)merge(l)}catch(e){}
T.left=T.startLeft=T.len*60;render();
$("sync").textContent="Progresso salvo neste celular. Faça um backup de vez em quando em Perfil.";
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script></body></html>
